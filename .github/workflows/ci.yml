name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/static-check.mjs
      - run: node scripts/format-check.mjs
      - run: node --test
      - run: node bin/saveweaver.js check --project examples/space-ranger

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: saveweaver-release-candidate
          path: artifacts/
          if-no-files-found: error

  action-smoke:
    name: Bundled Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          project: examples/space-ranger
      - uses: actions/upload-artifact@v7
        with:
          name: action-matrix-report
          path: saveweaver-matrix.md
          if-no-files-found: error
