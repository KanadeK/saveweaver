<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">SaveWeaver</title>
  <desc id="description">Three historical game save slots woven through verified migrations into one current save.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#17112e"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d7ff"/>
      <stop offset=".55" stop-color="#9a7cff"/>
      <stop offset="1" stop-color="#75f0bb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="26" fill="url(#background)"/>
  <g opacity=".15" stroke="#b7b9e8">
    <path d="M0 72h1280M0 144h1280M0 216h1280M0 288h1280"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360M640 0v360M720 0v360M800 0v360M880 0v360M960 0v360M1040 0v360M1120 0v360M1200 0v360"/>
  </g>
  <g transform="translate(72 66)">
    <g fill="#151d38" stroke="#465276" stroke-width="3">
      <rect x="0" y="0" width="120" height="72" rx="14"/>
      <rect x="0" y="102" width="120" height="72" rx="14"/>
      <rect x="0" y="204" width="120" height="72" rx="14"/>
    </g>
    <g fill="#dfe7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">
      <text x="60" y="45" text-anchor="middle">SAVE v1</text>
      <text x="60" y="147" text-anchor="middle">SAVE v2</text>
      <text x="60" y="249" text-anchor="middle">SAVE v3</text>
    </g>
    <g fill="none" stroke="url(#thread)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
      <path d="M120 36C240 36 250 138 365 138S505 87 610 87 735 138 840 138"/>
      <path d="M120 138h245c118 0 135-51 245-51s130 51 230 51"/>
      <path d="M120 240c125 0 125-102 245-102s140 0 245 0h230"/>
    </g>
    <g transform="translate(840 84)">
      <path d="M0 54 48 0l48 54v112l-48 34L0 166Z" fill="#172a35" stroke="#75f0bb" stroke-width="4"/>
      <path d="m25 93 17 18 31-39" fill="none" stroke="#75f0bb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="151" fill="#dfffee" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">v4</text>
    </g>
  </g>
  <g transform="translate(1030 105)" fill="#f5f2ff">
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="800" letter-spacing="-2">SaveWeaver</text>
    <text y="48" fill="#bfc6e8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">GAME-SAVE COMPATIBILITY CI</text>
    <text y="101" fill="#75f0bb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">schema ✓</text>
    <text y="128" fill="#75f0bb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">migration ✓</text>
    <text y="155" fill="#75f0bb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">determinism ✓</text>
  </g>
</svg>
